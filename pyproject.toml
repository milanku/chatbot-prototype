[project]
name = "chatbot-prototype"
version = "0.1.0"
description = "Chatbot prototype: doc RAG + transactions QA"
requires-python = ">=3.10,<4.0.0"
dependencies = [
  # Core
  "pydantic>=2.6",
  "python-dotenv>=1.0",

  # CLI + API
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",

  # LangChain (core + community integrations)
  "langchain>=0.2.11",

  # Alternative to LangChain

  # Document parsing / splitting helpers
  "markdown-it-py>=3.0",
  "beautifulsoup4>=4.12",

  # Vector store option A (recommended for easy local dev): Chroma

  # Time parsing (useful for routes 2 timeframes)
  "dateparser>=1.2",
  "langchain-openai (>=1.1.11,<2.0.0)",
  "langchain-core (>=1.2.20,<2.0.0)",
  "pydantic-settings (>=2.13.1,<3.0.0)",
  "flagembedding (>=1.4.2,<2.0.0)",
  "sentence-transformers (<5)",
  "einops (>=0.8.2,<0.9.0)",
]

keywords = ["chatbot", "RAG", "QA", "AI"]
authors = [
  { name = "Milan Kubala" }
]
license = "MIT"

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "types-python-dateutil",
  "black>=23.0",
  "isort>=5.12",
  "tox>=4.0",
  "hypothesis>=6.0",
  "sphinx>=7.0",
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.tox]
requires = ["tox>=4.0"]

[tool.sphinx]
project = "Chatbot Prototype"
version = "0.1.0"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "Q"]
ignore = ["E501", "SIM108"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
strict = true
warn_unused_configs = true
disallow_any_generics = true
no_implicit_optional = true
plugins = []

[tool.poetry]
name = "chatbot-prototype"
version = "0.1.0"
description = "Chatbot prototype: doc RAG + transactions QA"
authors = ["Milan Kubala"]
packages = [{ include = "bot", from = "src" }]
[dependency-groups]
dev = [
    "ruff (>=0.15.2,<0.16.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "pylance (>=2.0.1,<3.0.0)"
]
